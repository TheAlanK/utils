name: UberWatch Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'UberWatch/**'
      - '.github/workflows/uberwatch-build-apk.yml'
  pull_request:
    paths:
      - 'UberWatch/**'
      - '.github/workflows/uberwatch-build-apk.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: UberWatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UberWatch-debug-apk
          path: UberWatch/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
